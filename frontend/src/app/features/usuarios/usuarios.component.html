<div class="contenedor">
  <div class="tarjeta">
    <h1>Usuarios registrados</h1>

    <table class="tabla">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Telefono</th>
          <th>Rol</th>
        </tr>
      </thead>
      <tbody>
        @for (usuario of usuarios; track usuario.id) {
          <tr>
            <td>{{ usuario.id }}</td>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.correo }}</td>
            <td>{{ usuario.telefono || '-' }}</td>
            <td>{{ usuario.rol }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5">No hay usuarios registrados</td>
          </tr>
        }
      </tbody>
    </table>

    <a class="enlace" routerLink="/inicio">Volver al inicio</a>
  </div>
</div>
